extends: ../../configs/default.yaml

study:
  status: active

project:
  random_seed: 42

sampling:
  random_trace_holdout_fraction: 0.20
  validation_fraction_of_holdout: 0.25

normalization:
  coordinates: train_minmax_linear_plus_azimuth_sin_cos
  amplitude: train_global_rms

model:
  name: siren
  input_features: 6
  hidden_width: 256
  hidden_layers: 4
  omega_0: 300.0

training:
  loss: l2
  optimizer: adam
  learning_rate: 1.0e-3
  validation_batch_size: 65536
  device: cuda:0

experiment:
  trace_count: 8
  total_updates: 50000
  report_interval: 500
  full_batch: true
  correlation_eps: 1.0e-4
  conditions:
    - label: mse_control
      correlation_weight: 0.0
    - label: mse_corr_0p1
      correlation_weight: 0.1
