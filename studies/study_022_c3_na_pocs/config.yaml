extends: ../../configs/default.yaml

study:
  status: draft

project:
  random_seed: 42

sampling:
  split_scope: c3_source_line_blocks
  source_line_ranges:
    train: [0, 25]
    validation: [25, 35]
    test: [35, 50]
  duplicate_physical_coordinate_policy: keep_lowest_array_row

interpolation_mask:
  partition: validation
  kind: random_trace
  missing_fraction: 0.8

benchmark_case:
  id: c3_na_validation_random_trace_80_seed42

benchmark_volume:
  id: c3_na_validation_t0_384_sl25_35_sh27_59_rx0_8_ry18_50
  selection:
    time: [0, 384]
    source_line: [25, 35]
    shot_in_line: [27, 59]
    relative_receiver_x: [0, 8]
    relative_receiver_y: [18, 50]

pocs:
  n_iterations: 100
  threshold_start: 1.0
  threshold_end: 0.01
  window_shape: [128, 8, 16, 8, 32]
  overlap: [64, 4, 8, 4, 16]

evaluation:
  primary_metric: physical_amplitude_global_snr_db
  domain: evaluation_target
