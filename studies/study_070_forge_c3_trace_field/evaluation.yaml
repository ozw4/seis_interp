# Analysis-only configuration. grid.yaml/configs/method YAMLs are launch-frozen.
# Every contrast against study_067 is exploratory and post hoc: it lies outside
# study_067's registered contrast families. Declared before any study_070 test
# value is read.
role: exploratory_post_hoc_outside_study_067_registered_families
bootstrap:
  seed: 670703
  resamples: 10000
  interval: percentile_95
  p_value: null_centred_two_sided_plus_one
  weights: multinomial_shared_across_seeds_methods_contrasts_and_metrics_per_dataset
cluster_column: source_cell
experiments:
  c3: null  # Supplied by --c3 (repository-relative path).
  forge: null  # Supplied by --forge (repository-relative path).
datasets:
  c3:
    source_cell_count: 512
    primary_population: all_eligible
    amplitude: observed_global_rms_physical_predictions
  forge:
    source_cell_count: 192
    primary_population: clean_target
    amplitude: per_trace_oracle_test_rms
selection:
  stage: S1
  metric: masked_trace_relative_mse
  tie_break: candidate_id
  diverged: rank_last
# Same rule and thresholds as study_067: best of the 25 candidates on S1 validation.
# Descriptive only. A miss is reported and stops the study; it never selects
# between the neural-implicit parameterizations and never triggers a rescue arm.
floor:
  domain: s1_validation_best_of_25
  metric: mean_trace_snr_db
  c3: 10.0
  forge: 0.4
# Per candidate, from the first update: updates 901-1000 of loss/L0 and
# output_rms/target_rms. Descriptive; never a selection or restart criterion.
zero_predictor_gate:
  loss_over_L0_max: 0.95
  output_rms_over_target_rms_min: 0.2
  updates: [901, 1000]
left:
  method: inr_real
  experiments:
    c3: null
    forge: null
right:
  methods: [regsi_real, ccnet5d_grid, nersi_profile, pocs_grid, drr_grid]
  experiments:
    c3:
      path: runs/study_067_forge_c3_common_grid/20261024T110740093298Z_5ad36bdb74fd_traces
      sha256: 719a0d5e4b171250b69b24b247796c02ea58c34762d7572bd3a00a27f20a8cbd
    forge:
      path: runs/study_067_forge_c3_common_grid/20261024T110745841828Z_5ad36bdb74fd_forge
      sha256: c2105a777af4bcda8214d09515d452fd0eb4171cd1d5035833ee567f098e0fc2
  analysis:
    path: results/study_067_forge_c3_common_grid/20261103T231944Z_ba805bd26f6a_analysis
    manifest_sha256: 802471006c88127f513ba53fffc13414756d30597b17c841984798b19edaccb0
    selection_c3_sha256: 820b72216a3a69b0e1f1bdd3a360650eb4ca61120bf095829ab3ef9f6a6ce40e
    selection_forge_sha256: 8c7bb288eefae671830b0031872f0b538d285b97103de965799a545656fb814f
  grid: studies/study_067_forge_c3_common_grid/grid.yaml
  grid_sha256: 1a48bb2532c52353b535e828286b769bc49115487b316d5e05374f4034690098
  evaluation: studies/study_067_forge_c3_common_grid/evaluation.yaml
  evaluation_sha256: 3c76742dea34f85b0317d2778f02c46bb32fe5c387ee27d180bedd31833f4ed0
# Two contrasts per family (c3 and forge), Holm within each family. Keeping the
# families small avoids redefining study_067's eight-contrast families.
contrasts:
  holm_families:
    output_unit_snr:
      contrast: inr_real_minus_nersi_profile
      metric: snr_db
    output_unit_relmse:
      contrast: inr_real_minus_nersi_profile
      metric: relative_mse
    proposed_vs_field_snr:
      contrast: regsi_real_minus_inr_real
      metric: snr_db
    proposed_vs_field_relmse:
      contrast: regsi_real_minus_inr_real
      metric: relative_mse
  descriptive:  # No multiplicity adjustment.
  - inr_real_minus_ccnet5d_grid
  - inr_real_minus_pocs_grid
  - inr_real_minus_drr_grid
# study_067's four partitions per dataset are invariant to study_id, so the
# pairing is exact and the identity is checked, not assumed.
partition_identity: assert_study_070_seed_partitions_hash_equal_study_067
metrics:
  snr_db: 10 * (log10(target_energy) - log10(error_energy)); no clipping or epsilon
  primary: equal_weight_mean_of_three_seed_test_mean_trace_snr_db
  seed_dispersion: sample_sd_ddof_1
  relative_mse: mean(error_energy / target_energy); zero target uses sample_count denominator
  global_nmse: sum(error_energy) / sum(target_energy)
  global_snr_db: -10 * log10(global_nmse)
  median_correlation: median_of_defined_centred_per_trace_Pearson_correlations
  trace_snr_quantiles: [10, 50, 90]
  fraction_below_0_db: mean(trace_snr_db < 0)
  prediction_energy: sum_over_time(prediction ** 2); saved_physical_prediction
  idw_scale_k_i: exp(IDW(log(observed_trace_RMS))) / oracle_trace_RMS
  idw_prediction: float32(saved_physical_prediction * idw_scale_k_i)
  scale_invariant_relative_mse: per_trace_least_squares_scalar_times_prediction_vs_target
idw:
  geometry: projected_grid
  radius: 2
  power: 2.0
  distance: physical
  restoration: multiply_once
sensitivities:
  paired_t: seed_level_95_percent_df_2
  validation_free: exclude_union_of_all_S1_validation_trace_ids_of_both_studies
  ema_shadow: saved_validation_and_test_metrics_where_present
  multiplicity: descriptive_no_additional_adjustment
search_diagnostics:
  expected_best_of_k: empirical_with_replacement; retain_all_diverged_probability_separately
  winners_curse: S1_cluster_bootstrap_in_bag_selection_and_out_of_bag_evaluation
# Extra scores enter search diagnostics and the S1-validation exclusion union,
# never the registered grid selection.
extra_pilot_score_sources: []
