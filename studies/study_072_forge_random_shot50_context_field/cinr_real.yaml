method_id: cinr_real
geometry_mode: real
device: cuda:0
loss: masked_trace_mse
checkpoint_rule: fixed_final_ema
model_seed: 7301
model:
  input_features: 4
  fourier_components: 40
  frequency_base: 1.05
  width: 120
  stem_kernel_size: 9
  time_downsample_factor: 4
  activation: gelu
  output_activation: linear
  time_sample_count: 1001
training:
  optimizer: adamw
  learning_rate: 0.001
  max_steps: 50000
  weight_decay: 0.0
  report_interval: 100
  learning_rate_schedule: constant
  mixed_precision: 'off'
  ema_decay: 0.999
  ema_eval_decays:
  - 0.999
  - 0.9995
  - 0.9998
  batch_size: 64
prediction:
  batch_size: 64
context:
  neighbor_count: 16
