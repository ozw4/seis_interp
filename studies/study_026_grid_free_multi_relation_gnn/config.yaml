project: {random_seed: 42}
data: {dataset_id: seg_c3_na}
model:
  name: relational_trace_graph
  width: 64
  message_passing_rounds: 2
  time_downsample_factor: 2
  stem_kernel_size: 7
  temporal_kernel_size: 5
  temporal_dilations: [1, 2]
  attention_width: 32
  relation_embedding_dim: 8
  relation_fusion: learned_gate
  method_variant: relational
  explicit_azimuth_features: true
graph:
  neighbors_per_relation: 8
  max_normalized_distance: 1.0
  candidate_chunk_size: 4096
  topology: multi_relation
  excluded_relation: null
  common_distance_scales_m: [320.0, 320.0]
  single_4d_neighbors: 32
  relations:
    source: {source_scale_m: 160.0, receiver_scale_m: 640.0}
    receiver: {source_scale_m: 640.0, receiver_scale_m: 160.0}
    cmp: {midpoint_scale_m: 160.0, offset_vector_scale_m: 640.0}
    offset_azimuth: {midpoint_scale_m: 640.0, offset_vector_scale_m: 160.0}
geometry_features:
  position_scale_m: 1000.0
  offset_scale_m: 1000.0
  azimuth_min_offset_m: 1.0
training_data: {pool: all_train_traces, time_samples: [0, 384]}
training_mask:
  kinds: [random_trace, random_whole_ffid]
  kind_probabilities: [0.5, 0.5]
  missing_fractions: [0.5, 0.8]
training:
  device: cuda:0
  random_seed: 42
  loss: masked_mse
  max_steps: 10000
  query_batch_size: 8
  validation_interval: 250
  learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
evaluation:
  primary_metric: physical_amplitude_global_snr_db
  domain: evaluation_target
  query_batch_size: 8
diagnostics:
  time_s: [0.0, 0.5, 1.0, 1.6]
  offset_m: [0.0, 500.0, 1000.0, 2000.0, 5000.0]
  azimuth_deg: [0.0, 90.0, 180.0, 270.0, 360.0]
