study:
  status: draft

project:
  random_seed: 42

data:
  dataset_id: seg_c3_na
  data_root_env: SEIS_INTERP_DATA_ROOT

# Required only to generate the prepare-baseline artifact; DRR applies neither
# coordinate nor amplitude normalization and keeps physical amplitudes unchanged.
normalization:
  coordinates: train_minmax_linear_plus_azimuth_sin_cos
  amplitude: train_global_rms

sampling:
  split_scope: c3_source_line_blocks
  source_line_ranges:
    train: [0, 25]
    validation: [25, 35]
    test: [35, 50]
  duplicate_physical_coordinate_policy: keep_lowest_array_row

interpolation_mask:
  partition: validation
  kind: random_trace
  missing_fraction: 0.8

benchmark_case:
  id: c3_na_validation_random_trace_80_seed42

benchmark_volume:
  id: c3_na_validation_t0_384_sl25_35_sh27_59_rx0_8_ry18_50
  selection:
    time: [0, 384]
    source_line: [25, 35]
    shot_in_line: [27, 59]
    relative_receiver_x: [0, 8]
    relative_receiver_y: [18, 50]

drr:
  rank: 4
  damping_power: 3
  n_iterations: 10
  frequency_min_hz: 5.0
  frequency_max_hz: null
  spatial_window_shape: [5, 8, 4, 8]
  spatial_overlap: [0, 0, 0, 0]

evaluation:
  primary_metric: physical_amplitude_global_snr_db
  domain: evaluation_target
