model:
  name: siren
  coordinate_features: cmp_offset_azimuth
  input_features: 6
  hidden_width: 256
  hidden_layers: 4
  output_features: 1
  omega_0: 30.0
  hidden_omega: 30.0
  layer_omega_schedule: null
  skip_connections: null
training:
  random_seed: 20260908
  optimizer: adam
  loss: l2
  learning_rate: 0.0001
  batch_size: 16384
  max_steps: 2000
  report_interval: 100
  device: cuda:1
  amplitude_scaling: per_trace_rms
prediction:
  batch_size: 65536
  scale_interpolation:
    neighbors: 8
    power: 2.0
    distance_scales_m:
    - 160.0
    - 80.0
    - 40.0
    - 40.0
evaluation:
  primary_metric: physical_amplitude_global_snr_db
  domain: evaluation_target
