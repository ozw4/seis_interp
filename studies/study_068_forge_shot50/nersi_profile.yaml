method_id: nersi_profile
geometry_mode: real
canvas_time_upsampling: true
device: cuda:0
loss: masked_trace_mse
checkpoint_rule: fixed_final_ema
model_seed: 7301
model:
  input_features: 3
  fourier_components: 40
  frequency_base: 1.075
  encoder_width: 40
  latent_channels: 28
  decoder_channels:
  - 29
  - 14
  - 8
  profile_shape:
  - 2176
  - 32
  upsample_scales:
  - 2
  - 2
  - 2
  kernel_size: 5
  activation: gelu
  output_activation: linear
training:
  optimizer: adamw
  learning_rate: 0.001
  max_steps: 50000
  weight_decay: 0.0
  report_interval: 100
  learning_rate_schedule: constant
  mixed_precision: 'off'
  ema_decay: 0.999
  ema_eval_decays:
  - 0.999
  - 0.9995
  - 0.9998
  supervised_traces_per_update: 64
  nuclear_norm_weight: 0.03
  coordinate_jitter_cells: 0.5
prediction:
  profile_batch_size: 64
execution:
  saved_tensors_on_cpu: false
