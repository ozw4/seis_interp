method_id: regsi_real
geometry_mode: real
model:
  width: 128
  message_passing_rounds: 2
  time_downsample_factor: 2
  stem_kernel_size: 7
  temporal_kernel_size: 5
  temporal_dilations:
  - 6
  - 12
  attention_width: 32
  relation_embedding_dim: 8
  relation_fusion: learned_gate
  method_variant: relational
  explicit_azimuth_features: true
  amplitude_mode: train_global_rms
  max_edge_time_shift_samples: 0
  node_fourier_components: 0
  attention_pooling: rms
training:
  optimizer: adamw
  learning_rate: 0.001
  max_steps: 50000
  weight_decay: 0.0
  report_interval: 100
  learning_rate_schedule: constant
  mixed_precision: 'off'
  query_batch_size: 64
  inner_mask_fraction: 0.25
  gradient_clip_norm: 1.0
  cudnn_benchmark: false
  ema_decay: 0.999
  ema_eval_decays:
  - 0.999
  - 0.9995
  - 0.9998
  execution:
    neighbor_table: true
    prefetch: true
    deferred_checks: true
    foreach_ema: true
    shared_prediction: true
    cpu_threads: 4
graph:
  neighbors_per_relation: 5
  max_normalized_distance: 1.0
  candidate_chunk_size: 4096
  topology: multi_relation
  neighbor_search: exact_index
  relations:
    source:
      source_scale_m: 160.0
      receiver_scale_m: 640.0
    receiver:
      source_scale_m: 640.0
      receiver_scale_m: 160.0
    cmp:
      midpoint_scale_m: 160.0
      offset_vector_scale_m: 640.0
    offset_azimuth:
      midpoint_scale_m: 640.0
      offset_vector_scale_m: 160.0
geometry_features:
  position_scale_m: 500.0
  offset_scale_m: 500.0
  azimuth_min_offset_m: 1.0
prediction:
  query_batch_size: 16
loss: masked_trace_mse
checkpoint_rule: fixed_final_ema
model_seed: 7301
device: cuda:0
execution:
  saved_tensors_on_cpu: false
  model_memory_options:
    receptive_field_pruning: true
    fused_edge_aggregation: true
    activation_checkpointing: true
