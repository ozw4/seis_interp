study:
  status: running

project:
  random_seed: 42

data:
  dataset_id: seg_c3_na
  data_root_env: SEIS_INTERP_DATA_ROOT

sampling:
  random_ffid_holdout_fraction: 0.5
  validation_fraction_of_holdout: 0.25
  split_scope: whole_ffid
  trace_amplitude_filter:
    exclude_all_zero: true
    max_abs_amplitude: 10000.0
  duplicate_physical_coordinate_policy: keep_lowest_array_row

normalization:
  coordinates: train_minmax_linear_plus_azimuth_sin_cos
  amplitude: train_global_rms

model:
  name: trace_graph_interpolator
  hidden_width: 64
  graph_mode: trace_lattice
  message_passing_rounds: 4
  time_downsample_factor: 5
  stem_kernel_size: 7
  temporal_kernel_size: 5
  temporal_dilations: [1, 2, 4, 8]
  spatial_kernel_size: 3
  attention_width: 32
  distance_epsilon: 1.0e-6
  target_coordinates:
    - source_x_m
    - source_y_m
  target_coordinate_scaling: train_minmax
  neighborhood:
    type: nearest_train_source_gathers
    distance: euclidean_source_xy_m
    source_gather_count: 8

training:
  amplitude_scaling: per_trace_rms
  loss: masked_l2_spectrum_slope_amplitude
  spectrum_weight: 0.0
  slope_weight: 0.0
  amplitude_weight: 0.0
  optimizer: adamw
  learning_rate: 5.0e-4
  weight_decay: 1.0e-5
  learning_rate_schedule: cosine
  minimum_learning_rate: 1.5e-5
  total_steps: 2500
  batch_size: 2
  target_sampling: epoch_without_replacement
  exclude_target_ffid_neighbors: true
  neighbor_dropout: 0.05
  gradient_clip_norm: 1.0
  evaluation_interval_steps: 2500
  validation_batch_size: 4
  training_audit_count: 10000
  mixed_precision: bfloat16
  device: cuda:0

evaluation:
  primary_metric: oracle_per_trace_unit_rms_global_snr_db
  success_threshold_db: 20.0
  comparison: strictly_greater_than
  required_eligible_ffid_count: 4780
  required_ffid_split_counts:
    train: 2390
    validation: 598
    test: 1792
  required_sample_count: 625
  required_effective_split_counts:
    train: 1155304
    validation: 293151
    test: 855010
  required_fully_excluded_ffids: [1746]
