study:
  status: draft

project:
  random_seed: 42

data:
  dataset_id: seg_c3_na
  data_root_env: SEIS_INTERP_DATA_ROOT

# Shared prepare-baseline artifact generation contract. interpolate siren fits
# selected-volume geometry bounds and observed-sample RMS itself; it does not
# load the prepared normalization.json.
normalization:
  coordinates: train_minmax_linear_plus_azimuth_sin_cos
  amplitude: train_global_rms

sampling:
  split_scope: c3_source_line_blocks
  source_line_ranges:
    train: [0, 25]
    validation: [25, 35]
    test: [35, 50]
  duplicate_physical_coordinate_policy: keep_lowest_array_row

interpolation_mask:
  partition: validation
  kind: random_trace
  missing_fraction: 0.8

benchmark_case:
  id: c3_na_validation_random_trace_80_seed42

benchmark_volume:
  id: c3_na_validation_t0_384_sl25_35_sh27_59_rx0_8_ry18_50
  selection:
    time: [0, 384]
    source_line: [25, 35]
    shot_in_line: [27, 59]
    relative_receiver_x: [0, 8]
    relative_receiver_y: [18, 50]

model:
  name: siren
  coordinate_features: cmp_offset_azimuth
  input_features: 6
  hidden_width: 256
  hidden_layers: 4
  output_features: 1
  omega_0: 30.0
  hidden_omega: 30.0
  layer_omega_schedule: null
  skip_connections: null

training:
  # Model initialization and observed-point sampler seed; distinct from the
  # project seed that binds the benchmark mask and case.
  random_seed: 42
  optimizer: adam
  loss: l2
  learning_rate: 0.0001
  batch_size: 65536
  max_steps: 20000
  report_interval: 500
  device: cuda:0

prediction:
  batch_size: 262144

evaluation:
  primary_metric: physical_amplitude_global_snr_db
  domain: evaluation_target
