model:
  name: siren
  coordinate_features: cmp_cartesian_half_offset
  input_features: 5
  hidden_width: 256
  hidden_layers: 4
  output_features: 1
  omega_0: 90.0
  hidden_omega: 30.0
  layer_omega_schedule: null
  skip_connections: null
  time_coordinate_scale: 4.0
training:
  random_seed: 20260908
  optimizer: adam
  loss: l2
  learning_rate: 0.0001
  batch_size: 262144
  max_steps: 50000
  report_interval: 500
  device: cuda:1
  amplitude_scaling: per_trace_rms
  batch_mode: random_complete_traces
  traces_per_step: 435
  learning_rate_schedule: cosine
  minimum_learning_rate: 1.0e-06
prediction:
  batch_size: 65536
  scale_interpolation:
    neighbors: 8
    power: 2.0
    distance_scales_m:
    - 160.0
    - 80.0
    - 40.0
    - 40.0
evaluation:
  primary_metric: physical_amplitude_global_snr_db
  domain: evaluation_target
