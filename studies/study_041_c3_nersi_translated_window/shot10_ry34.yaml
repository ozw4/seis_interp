  sampling_seed: 201
  optimizer: adam
  loss: masked_trace_mse
  amplitude_scaling: observed_volume_global_rms
  learning_rate: 0.001
  profiles_per_step: 16
  max_steps: 50000
  report_interval: 100
  device: cuda:1
prediction:
  batch_size: 64
time_alignment:
  receiver_y_shift_samples_per_cell: 3.0625
  boundary: fourier_periodic
optimization:
  learning_rate_schedule: constant
  minimum_learning_rate: 0.001
  ema_decay: 0.999
