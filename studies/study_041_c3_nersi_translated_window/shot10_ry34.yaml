project:
  random_seed: 42
data:
  dataset_id: seg_c3_na
benchmark_case:
  id: c3_window_shot10_ry34_random80_seed42
benchmark_volume:
  id: c3_window_shot10_ry34_random80_seed42_volume
  selection:
    time:
    - 0
    - 384
    source_line:
    - 25
    - 41
    shot_in_line:
    - 10
    - 42
    relative_receiver_x:
    - 0
    - 8
    relative_receiver_y:
    - 34
    - 66
