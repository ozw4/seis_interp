# Analysis-only configuration. grid.yaml/configs/method YAMLs are launch-frozen.
# Every contrast is exploratory and post hoc: it lies outside the registered
# families of study_067 and of study_070. Declared before any study_071 test
# value is read. The conditioning families isolate the one mechanism this study
# changes: the same four coordinates, read with and without observed context.
role: exploratory_post_hoc_outside_study_067_registered_families
bootstrap:
  seed: 670703
  resamples: 10000
  interval: percentile_95
  p_value: null_centred_two_sided_plus_one
  weights: multinomial_shared_across_seeds_methods_contrasts_and_metrics_per_dataset
cluster_column: source_cell
experiments:
  c3: null
  forge: null
datasets:
  c3:
    source_cell_count: 512
    primary_population: all_eligible
    amplitude: observed_global_rms_physical_predictions
  forge:
    source_cell_count: 192
    primary_population: clean_target
    amplitude: per_trace_oracle_test_rms
selection:
  stage: S1
  metric: masked_trace_relative_mse
  tie_break: candidate_id
  diverged: rank_last
floor:
  domain: s1_validation_best_of_25
  metric: mean_trace_snr_db
  c3: 10.0
  forge: 0.4
zero_predictor_gate:
  loss_over_L0_max: 0.95
  output_rms_over_target_rms_min: 0.2
  updates:
  - 901
  - 1000
left:
  method: cinr_real
  experiments:
    c3: null
    forge: null
contrasts:
  holm_families:
    conditioning_snr:
      contrast: cinr_real_minus_inr_real
      metric: snr_db
    conditioning_relmse:
      contrast: cinr_real_minus_inr_real
      metric: relative_mse
    output_unit_snr:
      contrast: cinr_real_minus_nersi_profile
      metric: snr_db
    output_unit_relmse:
      contrast: cinr_real_minus_nersi_profile
      metric: relative_mse
    proposed_vs_field_snr:
      contrast: regsi_real_minus_cinr_real
      metric: snr_db
    proposed_vs_field_relmse:
      contrast: regsi_real_minus_cinr_real
      metric: relative_mse
  descriptive:
  - cinr_real_minus_ccnet5d_grid
  - cinr_real_minus_pocs_grid
  - cinr_real_minus_drr_grid
partition_identity: assert_study_071_seed_partitions_hash_equal_study_067
metrics:
  snr_db: 10 * (log10(target_energy) - log10(error_energy)); no clipping or epsilon
  primary: equal_weight_mean_of_three_seed_test_mean_trace_snr_db
  seed_dispersion: sample_sd_ddof_1
  relative_mse: mean(error_energy / target_energy); zero target uses sample_count
    denominator
  global_nmse: sum(error_energy) / sum(target_energy)
  global_snr_db: -10 * log10(global_nmse)
  median_correlation: median_of_defined_centred_per_trace_Pearson_correlations
  trace_snr_quantiles:
  - 10
  - 50
  - 90
  fraction_below_0_db: mean(trace_snr_db < 0)
  prediction_energy: sum_over_time(prediction ** 2); saved_physical_prediction
  idw_scale_k_i: exp(IDW(log(observed_trace_RMS))) / oracle_trace_RMS
  idw_prediction: float32(saved_physical_prediction * idw_scale_k_i)
  scale_invariant_relative_mse: per_trace_least_squares_scalar_times_prediction_vs_target
idw:
  geometry: projected_grid
  radius: 2
  power: 2.0
  distance: physical
  restoration: multiply_once
sensitivities:
  paired_t: seed_level_95_percent_df_2
  validation_free: exclude_union_of_all_S1_validation_trace_ids_of_studies_067_070_and_071
  ema_shadow: saved_validation_and_test_metrics_where_present
  multiplicity: descriptive_no_additional_adjustment
search_diagnostics:
  expected_best_of_k: empirical_with_replacement; retain_all_diverged_probability_separately
  winners_curse: S1_cluster_bootstrap_in_bag_selection_and_out_of_bag_evaluation
extra_pilot_score_sources: []
right:
  sources:
    study_067:
      methods:
      - regsi_real
      - ccnet5d_grid
      - nersi_profile
      - pocs_grid
      - drr_grid
      experiments:
