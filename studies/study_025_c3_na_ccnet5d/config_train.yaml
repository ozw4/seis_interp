study:
  status: draft
project:
  random_seed: 42
data:
  dataset_id: seg_c3_na
model:
  name: ccnet5d
  hidden_channels: 64
  intermediate_channels: 64
  kernel_size: 5
  output_activation: linear
supervision:
  partition: train
  amplitude_normalization: fit_region_global_rms
  fit_region:
    time: [0, 384]
    source_line: [0, 16]
    shot_in_line: [27, 59]
    relative_receiver_x: [0, 8]
    relative_receiver_y: [18, 34]
  selection_region:
    time: [0, 384]
    source_line: [0, 16]
    shot_in_line: [59, 75]
    relative_receiver_x: [0, 8]
    relative_receiver_y: [18, 34]
patches:
  shape: [16, 16, 16, 8, 16]
  fit_count: 10000
  selection_count: 1000
  missing_fraction: 0.8
  mask_kind: random_trace
  random_seed: 42
training:
  optimizer: adam
  loss: mse_complete_patch
  random_seed: 42
  batch_size: 1
  max_epochs: 20
  learning_rate: 0.0001
  decay_after_epochs: 15
  decay_factor: 0.1
  validate_every_steps: 2000
  report_every_steps: 200
  device: cuda:0
selection:
  metric: missing_global_snr_db
  domain: held_out_train_partition_patch_instances
