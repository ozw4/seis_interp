method_id: ccnet5d_grid
geometry_mode: grid
device: cuda:0
loss: masked_trace_mse
checkpoint_rule: fixed_final_ema
model_seed: 7301
model:
  hidden_channels: 36
  intermediate_channels: 37
  kernel_size: 3
  time_kernel_size: 9
  time_dilation: 1
  output_activation: linear
training:
  optimizer: adamw
  learning_rate: 0.001
  max_steps: 50000
  weight_decay: 0.0
  report_interval: 100
  learning_rate_schedule: constant
  mixed_precision: 'off'
  ema_decay: 0.999
  ema_eval_decays:
  - 0.999
  - 0.9995
  - 0.9998
  supervised_traces_per_update: 64
patches:
  shape:
  - 384
  - 4
  - 8
  - 4
  - 8
  inner_mask_fraction: 0.25
prediction:
  core_shape:
  - 64
  - 8
  - 16
  - 8
  - 16
execution:
  reuse_patch: false
  cache_patch_gradients: false
  cudnn_benchmark: true
