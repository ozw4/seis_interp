[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seis-interp"
version = "0.1.0"
description = "POC for coordinate-based multidimensional seismic interpolation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
]
segy = [
  "segyio>=1.9",
]
data = [
  "pandas>=2.0",
  "pyarrow>=14",
]
visualization = [
  "matplotlib>=3.7",
]
dev = [
  "pytest>=8",
  "ruff>=0.14",
]

[project.scripts]
seis-interp = "seis_interp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
