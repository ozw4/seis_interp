project:
  random_seed: 42

data:
  dataset_id: seg_c3_na
  data_root_env: SEIS_INTERP_DATA_ROOT

normalization:
  coordinates: train_minmax_linear_plus_azimuth_sin_cos
  amplitude: train_global_rms

model:
  name: siren
  input_features: 6
  hidden_layers: 4
  hidden_width: 256
  omega_0: 10.0
  hidden_omega: 1.0

training:
  loss: l1
  optimizer: adam
  learning_rate: 1.0e-5
  batch_size: 1024
  steps_per_epoch: 500
  max_epochs: 100
  early_stopping_patience: 10
  validation_batch_size: 65536
  device: cuda

evaluation:
  metrics:
    - signal_to_noise_ratio_db
    - normalized_root_mean_squared_error
    - correlation
